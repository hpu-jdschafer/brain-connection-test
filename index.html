<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain Experiment — Connection Test</title><style>body{font:16px system-ui,sans-serif;max-width:680px;margin:45px auto;padding:0 20px;color:#002856}h1{font-size:1.7rem}button{background:#007298;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}input{width:100%;padding:12px;box-sizing:border-box;margin:10px 0 15px;border:1px solid #aaa;border-radius:6px}pre{background:#edf5f8;padding:16px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#4F758B}</style></head><body><h1>Brain Experiment — Connection Test</h1><p>This page checks whether a browser can send a POST request to Google Apps Script <em>and read its JSON reply</em>. It does not collect student data.</p><label for="endpoint">Paste your deployed Apps Script <strong>/exec</strong> URL</label><input id="endpoint" value="https://script.google.com/macros/s/AKfycbzOXjKXdu_Y2gPFt87eMdJR5buVZ96bJ1X-aWYVIu7d2-SLUMoyZVTep7yA-bwZKIHs/exec" spellcheck="false"><button id="test">Test connection</button><p class="hint">For the definitive test, host this file on GitHub Pages rather than opening it as a local file.</p><pre id="result" role="status" aria-live="polite">Ready.</pre><script>document.getElementById('test').addEventListener('click',async()=>{const url=document.getElementById('endpoint').value.trim();const out=document.getElementById('result');if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){out.textContent='Enter the deployed Apps Script URL ending in /exec.';return}out.textContent='Sending POST request…';try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ping',message:'Hello from GitHub Pages'}),redirect:'follow'});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Response was not JSON. HTTP '+res.status+': '+raw.slice(0,250))}out.textContent=JSON.stringify({httpStatus:res.status,response:data},null,2)+(data.ok&&data.method==='POST'?'\n\nSUCCESS: POST response was readable.':'\n\nThe response did not pass the check.')}catch(err){out.textContent='FAILED: '+err.message+'\n\nPossible causes: deployment permissions, wrong URL, browser cross-origin restrictions, or a network problem. Do not assume success merely because the request reached Apps Script.'}});</script></body></html>
